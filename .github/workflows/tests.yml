name: tests
on:
  push:
  pull_request:
jobs:
  rapidas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar
        run: python -m pip install -e .
      # Pruebas rápidas: AGENTCAD_RAPIDAS=1 omite las pesadas (FEM, voxelización fina, procesos con límites, aligerado).
      # Las que requieren OpenSCAD se omiten solas si `openscad` no está en el PATH (la suite actual no tiene ninguna).
      - name: Pruebas rápidas
        run: AGENTCAD_RAPIDAS=1 python -m unittest discover -s tests -t .
  completas:
    # Suite completa (incluye las pesadas, ~1 min). Se ejecuta solo a mano o en la rama principal.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -t .
