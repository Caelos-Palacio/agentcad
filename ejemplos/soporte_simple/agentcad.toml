# Proyecto de ejemplo de agentcad: una placa soporte con ventanas hexagonales y un bloque vecino.
# Todas las rutas son relativas a este archivo. Ejecuta los comandos desde este directorio (o exporta AGENTCAD_PROYECTO).
[proyecto]
nombre = "soporte_simple"

[rutas]
stl = ["stl"]                  # `part = "placa_soporte"` se busca en estas carpetas
ensamblaje = "assembly.json"   # piezas, matrices y articulaciones (para interferencia y vecinas)
specs = "specs"                # spec-as-code por pieza
registro = "registro"          # registro JSONL encadenado por hash (no se versiona)
trabajo = "trabajo"            # copias de trabajo de las modificaciones (no se versiona)
params = "params.scad"         # parámetros OpenSCAD que edita el bloque aplicar_params
zonas = "zonas.json"           # zonas protegidas de describe_part (opcional)
estado_build = "build/status.json"

[bases]
linea_base = "stl_base"        # `part = "linea_base:placa_soporte"`: la pieza antes de aligerar

[build]
comando = ["python", "generar_stl.py"]   # lo ejecuta el bloque `build` con cwd en la raíz
timeout_s = 300

[material]                     # PETG, boquilla 0,4 mm
densidad_g_mm3 = 1.27e-3
ancho_linea_mm = 0.45

[impresion.defecto]
walls = 3
infill = 15

[impresion.placa_soporte]      # perfil de impresión de la pieza (rot = orientación sobre la cama)
walls = 3
infill = 15
rot = [0, 0, 0]
support = "no"
layer = 0.2

[impresion.pieza_vertical]     # solo para demostrar el aviso de orientación en las specs
rot = [-90, 0, 0]

[poses.girado]                 # poses discretas: articulaciones de assembly.json en grados
giro = 45

[interferencia]
umbral_mm3 = 0.1
excluir_categorias = []
excluir_grupos = []
exentos = []                   # pares que encajan por diseño: [["patron_a", "patron_b"]]

[respaldo]
archivos = ["generar_stl.py", "soporte.scad"]
directorios = []

# Modelo de carga declarado: placa apoyada en los 4 taladros (r 4,5 mm), 33 N repartidos sobre los pilares. SUPUESTOS de ejemplo, no medidos.
[estructura.placa_soporte]
modelo = "placa_apoyada"
apoyos = [[5, 5], [55, 5], [5, 35], [55, 35]]
radio_apoyo_mm = 4.5
carga_N = 33.0
espesor_mm = 3.0
E_MPa = 1900.0
nu = 0.38
admisible_MPa = 10.0
recomendado_mm = 0.8
casos = ["carga"]

[impresion.pieza_soporte_demo]   # solo para las pruebas: pieza con soportes declarados
support = "mínimo, solo bajo el puente"

# Soportes con ZONA declarada (cajas [xmin, ymin, zmin, xmax, ymax, zmax] en el marco de la pieza, mm): printability solo da por cubierto lo que cae dentro.
[impresion.pieza_soporte_zona]   # solo para las pruebas: el soporte cubre toda la luz bajo la mesa
support = "mínimo, solo bajo el puente"
support_regiones = [[3.0, 0.0, 0.0, 27.0, 20.0, 10.5]]

[impresion.pieza_soporte_parcial]   # solo para las pruebas: el soporte cubre solo un tramo de la luz
support = "mínimo, solo bajo el puente"
support_regiones = [[3.0, 0.0, 0.0, 10.0, 20.0, 10.5]]

[impresion.pieza_soporte_isla]   # solo para las pruebas: el soporte cubre el diente que arranca en el aire
support = "mínimo, bajo el diente"
support_regiones = [[9.0, 9.0, 5.5, 15.0, 15.0, 6.8]]

# check_gcode: perfil de máquina (cama, altura y límites) contra el que se analiza un gcode ya laminado. Valores de ejemplo: pon los de TU impresora.
[gcode]
perfil = "ejemplo"
celda_mm = 0.2                   # rejilla del análisis por capa

[gcode.perfiles.ejemplo]
cama_x_mm = 220.0                # obligatorios
cama_y_mm = 220.0
z_max_mm = 250.0
caudal_max_mm3_s = 8.0           # opcionales: sin límite declarado no se comprueba
temp_boquilla_max = 250
temp_cama_max = 80
velocidad_max_mm_s = 300
velocidad_primera_capa_mm_s = 50
limites_rol = { "Outer wall" = 120, "Sparse infill" = 120 }
densidad_g_cm3 = 1.27

# estimar_impresion: calibración DECLARADA (razón y error). Estos valores son de OTRO proyecto (Kobra 3, PETG, 0,4 mm; ver validacion/laminador/INFORME.md): no aplican a tus piezas ni a tu laminador.
# Ajusta los tuyos con agentcad.calibracion.calibrar(filas, 'masa_cad', 'filamento', 'placa'). Con menos de 8 grupos de calibración el bloque avisa `fiable: false`.
[calibracion]
perfil = "kobra3_petg_otro_proyecto"

[calibracion.perfiles.kobra3_petg_otro_proyecto]
razon_filamento = 0.810          # filamento del laminador / masa estimada del CAD (sin soportes)
error_filamento_rel = 0.11       # máx. error relativo de validación cruzada (dejando fuera una placa)
s_por_g = 135.1                  # segundos de impresión por gramo de masa del CAD
error_tiempo_rel = 0.16
n_grupos = 4
origen = "4 placas de otro proyecto, Kobra 3"
